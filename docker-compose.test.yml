# Local test database — a throwaway Azure SQL Edge container so
# tenant-isolation and invite-flow tests (packages/db/test/,
# apps/api/test/) can run against the real sqlserver Prisma provider without
# touching Azure. Same engine family Azure SQL Database itself runs, so RLS
# syntax (infra/sql/row-level-security.sql) is exercised for real, not
# approximated against a different database.
#
# Usage: npm run test:db  (see root package.json — starts this, waits for
# health, runs migrations + RLS, runs vitest, tears down)
services:
  test-sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "UniverseTest!2026"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
