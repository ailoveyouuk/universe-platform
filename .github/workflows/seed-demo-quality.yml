name: Seed demo quality data

# Manual run (2026-10-20). Simulated OTIF dates, complaints (SIM-CMP-nnn), CAPA actions and risk links for the Universe Demo
# organisation only. Fills blanks and adds records; never overwrites or deletes. DRY RUN by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (writes nothing). Untick to load."
        default: true
        type: boolean
      only:
        description: "all, or links (only re-point upheld supply-chain complaints at products with source approvals; fast)"
        default: "all"
        type: choice
        options: [all, links]

jobs:
  seed:
    runs-on: ubuntu-latest
    # Applying (dry_run off) uses the 'demo-data-apply' environment, so GitHub can require a reviewer; dry runs use 'demo-data-dryrun'.
    environment: ${{ format('{0}', inputs.dry_run) == 'false' && 'demo-data-apply' || 'demo-data-dryrun' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed (or dry run)
        run: npm run seed:demo-quality --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
          PRISMA_TX_TIMEOUT_MS: "120000"
