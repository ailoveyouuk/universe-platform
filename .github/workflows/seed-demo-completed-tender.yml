name: Seed demo completed tender

# Adds SIM-TND-004: a fully completed simulated tender and contract owned by Universe Demo (2026-10-22). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (writes nothing). Untick to apply."
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    # Applying (dry_run off) uses the 'demo-data-apply' environment, so GitHub can require a reviewer; dry runs use 'demo-data-dryrun'.
    environment: ${{ format('{0}', inputs.dry_run) == 'false' && 'demo-data-apply' || 'demo-data-dryrun' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed history (or dry run)
        run: npm run seed:demo-completed-tender --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRISMA_TX_TIMEOUT_MS: "120000"
