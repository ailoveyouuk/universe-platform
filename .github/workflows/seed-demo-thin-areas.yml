name: Seed demo thin areas

# Clarifications, addenda, contract evidence, performance responses, quality links, saved network searches and the Universe Demo agent profile (2026-10-26). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (writes nothing). Untick to apply."
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed thin areas (or dry run)
        run: npm run seed:demo-thin-areas --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRISMA_TX_TIMEOUT_MS: "600000"
