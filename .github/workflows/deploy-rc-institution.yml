name: Deploy rc-institution (Azure Static Web Apps)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: "319bca3b-1d0e-4538-9d23-0ad033b38b25"
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: "7d149337-7d97-4953-b00d-1ce0c923aa44"
          # Entra External ID (CIAM) — same "Renewables Connect Customers"
          # tenant as the learner app, own app registration ("RC Institution
          # Portal"). Setting these three flips msal.config.ts's
          # ciamConfigured to true, switching rc-institution off the
          # workforce tenant above and onto this one for institution
          # contacts. Matching AZURE_CIAM_* values must also be set on the
          # rc-api Container App (done separately in the Azure Portal) or
          # every API call after login will 401.
          NEXT_PUBLIC_AZURE_CIAM_DOMAIN: "platformcore.ciamlogin.com"
          NEXT_PUBLIC_AZURE_CIAM_TENANT_ID: "6654f402-9fb0-47e6-b0ee-4152f7244444"
          NEXT_PUBLIC_AZURE_CIAM_CLIENT_ID: "932a47cd-c055-4f6e-b68d-c738bf215424"
          NEXT_PUBLIC_API_BASE_URL: "https://rc-api.mangomushroom-567ebd13.uksouth.azurecontainerapps.io"
          NEXT_PUBLIC_APP_URL: "https://agreeable-plant-0f4c5cd0f.7.azurestaticapps.net"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RC_INSTITUTION }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # Repo root so Oryx installs workspace packages (resolves @rc/api-client, @rc/types)
          api_location: "" # Api source code path - optional
          output_location: "rc-institution/out" # Static export output relative to repo root
          app_build_command: "cd rc-institution && npm run build" # Build from app dir after workspace install
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
