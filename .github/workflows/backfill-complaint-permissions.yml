name: Backfill complaint permissions

# Manual run (2026-10-20). Adds quality.complaints.view/log/investigate/approve to existing organisations' Organization Admin, Quality Assurance, Responsible Person and Stakeholder Demo roles. Project Manager and all other roles get nothing (complaints are ring-fenced to quality roles). Idempotent; adds only. DRY RUN by default.
# Uses the same DEMO_LOAD_DATABASE_URL secret as the scale-data load and demo enrichment.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (writes nothing, lists what would be granted). Untick to apply."
        default: true
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Backfill (or dry run)
        run: npm run backfill:complaint-permissions --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
