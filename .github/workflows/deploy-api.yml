name: Deploy API

# Builds the API's Docker image, pushes it to Azure Container Registry, and
# updates the Container App to run it. Runs on push to main once the app
# code (not just infra) is ready to ship — infra must already exist (see
# deploy-infra.yml), this workflow only ever updates the running container.
#
# PREREQUISITES: same Azure OIDC setup as deploy-infra.yml, plus
# AZURE_CONTAINER_REGISTRY (login server, e.g. universepilotacr.azurecr.io)
# and AZURE_CONTAINER_APP_NAME repository secrets/variables, plus a
# DATABASE_URL repository secret for the "Apply database migrations" step
# below. This secret did not exist anywhere in the workflows before
# 2026-10-02 — see architecture-decisions.md ("CI: run prisma migrate
# deploy against production") for how this gap was found (the Quality
# page's "product sourcing approvals" 500 error, caused by
# product_source_approvals never being created in the live database even
# though the Prisma model and app code had already shipped) and why this
# step is the fix.
#
# IMPORTANT: DATABASE_URL here must use the dedicated `universe_migrations`
# login (infra/sql/create-migrations-login.sql), NOT universe_api_app's
# connection string (the one in Key Vault's `database-url` secret) and NOT
# the server admin login. universe_api_app deliberately has no DDL rights
# at all (see infra/sql/create-app-login.sql) — prisma migrate deploy needs
# to run real CREATE/ALTER TABLE statements, so it would fail with a
# permissions error using that credential. The server admin login would
# work too, but hands this CI pipeline a far bigger blast radius than the
# one task (running already-committed migration SQL) needs — run
# create-migrations-login.sql once (see its own header for the full
# walkthrough) and use that login's connection string here instead.
#
# Not runnable yet — no Azure subscription, no registry, nothing to push
# to. Written and ready for the moment there is.
#
# Path filter gap found and fixed 2026-10-09: packages/insights-db wasn't
# in the paths list below even though apps/api depends on it (logistics-
# insights and product-sourcing-insights both import from it) — a
# commit that only touched packages/insights-db (e.g. the getAggregated-
# LogisticsRoutes 500 fix) triggered CI but never rebuilt/redeployed the
# API container, so the fix silently never reached production. Confirmed
# live via GitHub Actions: commit a935319 (insights-db only) shows only a
# CI run, no Deploy API run, while every commit that also touched
# apps/api in the same push did get a Deploy API run. Added
# packages/insights-db/** to the paths list so this can't happen again.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/insights-db/**'
      - 'packages/types/**'
      - 'packages/auth/**'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}

      - name: Build and push API image
        run: |
          IMAGE="${{ vars.AZURE_CONTAINER_REGISTRY }}/universe-api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Needed only to run prisma migrate deploy below — the API itself
        # ships as the Docker image built above, this install is just for
        # the Prisma CLI and packages/db's generated client.
        run: npm install

      - name: Apply database migrations (prisma migrate deploy)
        # Runs BEFORE the container app is pointed at the new image, so the
        # schema a new app version expects already exists when it starts
        # handling traffic. migrate deploy only applies migrations already
        # committed under packages/db/prisma/migrations — it never generates
        # new ones and is safe to run against a database that's already up
        # to date (no-op). See the PREREQUISITES comment above re:
        # DATABASE_URL.
        run: npm run migrate:deploy --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image "$IMAGE"
