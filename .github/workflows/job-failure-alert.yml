name: Scheduled job failure alert

# Go-live gate 7 (2026-10-31): when a scheduled operational job fails, open (or add to) one GitHub issue per job, so the failure is visible
# and GitHub notifies the repository owner. Close the issue when the job is healthy again; a green run adds a note and closes it automatically.
on:
  workflow_run:
    workflows:
      - Nightly aggregation
      - Daily activity
      - Certification expiry reminders
      - CRM review reminders
      - Regulatory watch
      - Sync pharma reference
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    # Only scheduled runs (a person's manual test run failing is already in front of them).
    if: ${{ github.event.workflow_run.event == 'schedule' }}
    steps:
      - name: Open, update or close the issue for this job
        uses: actions/github-script@v7
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const name = process.env.RUN_NAME, url = process.env.RUN_URL, result = process.env.RUN_RESULT;
            const title = `Scheduled job failing: ${name}`;
            const label = "job-failure";
            try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: "b60205", description: "A scheduled job failed" }); } catch (e) { /* exists */ }
            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label, per_page: 100 })).data.find((i) => i.title === title);
            if (result === "success") {
              if (open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Healthy again: ${url}` });
                await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: "closed" });
              }
              return;
            }
            if (result !== "failure" && result !== "timed_out") return;
            const body = `**${name}** ${result === "timed_out" ? "timed out" : "failed"}: ${url}`;
            if (open) await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body: body + "\n\nThis issue closes by itself when the job next succeeds.", labels: [label] });
