name: Audit demo catalogue

# Read-only audit of the product catalogue (2026-10-22). Writes nothing.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Audit
        run: npm run audit:catalogue --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          PRISMA_TX_TIMEOUT_MS: "120000"
