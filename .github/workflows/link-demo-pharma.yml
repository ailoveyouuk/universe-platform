name: Link demo pharma

# Links simulated pharmaceutical products to the real EMA and MHRA register, ringfenced as simulated (2026-10-23).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only"
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Link
        run: npm run link:demo-pharma --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          PRISMA_TX_TIMEOUT_MS: "120000"
          DRY_RUN: ${{ inputs.dry_run }}
