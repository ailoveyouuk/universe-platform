name: Seed demo service tender

# A simulated services tender SIM-SVC-001: competitive RFQ for three standard services with two submitted competing bids and a draft bid for Universe Demo (2026-10-25). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      tender_ref:
        description: "Reference for the new simulated tender"
        default: "SIM-SVC-001"
        type: string
      tender_title:
        description: "Title"
        default: "Programme support and equipment services (simulated RFQ)"
        type: string
      issuer_name:
        description: "Issuing organisation (Universe Demo makes the demo organisation the issuer, with no bid from it)"
        default: "Andean Care Alliance 106"
        type: string
      single_evaluator:
        description: "Allow a single evaluator (for walkthroughs)"
        default: false
        type: boolean
      dry_run:
        description: "Dry run (writes nothing). Untick to apply."
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed service tender (or dry run)
        run: npm run seed:demo-service-tender --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          TENDER_REF: ${{ inputs.tender_ref }}
          TENDER_TITLE: ${{ inputs.tender_title }}
          ISSUER_NAME: ${{ inputs.issuer_name }}
          SINGLE_EVALUATOR: ${{ inputs.single_evaluator }}
          PRISMA_TX_TIMEOUT_MS: "120000"
