name: Seed demo competitive tender

# A second simulated tender SIM-TND-002: competitive RFQ with three submitted competing bids and a draft bid for Universe Demo (2026-10-21). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      tender_ref:
        description: "Reference for the new simulated tender"
        default: "SIM-TND-002"
        type: string
      tender_title:
        description: "Title"
        default: "Supply of antimalarial and diagnostic supplies (simulated RFQ)"
        type: string
      product_offset:
        description: "Shifts which simulated products are used (0 for the first tender)"
        default: "0"
        type: string
      single_evaluator:
        description: "Allow a single evaluator (for walkthroughs)"
        default: false
        type: boolean
      submit_demo:
        description: "Also submit Universe Demo's bid"
        default: false
        type: boolean
      demo_fresh:
        description: "Universe Demo is only invited (no interest or bid yet)"
        default: false
        type: boolean
      dry_run:
        description: "Dry run (writes nothing). Untick to apply."
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed competitive tender (or dry run)
        run: npm run seed:demo-competitive-tender --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          TENDER_REF: ${{ inputs.tender_ref }}
          TENDER_TITLE: ${{ inputs.tender_title }}
          PRODUCT_OFFSET: ${{ inputs.product_offset }}
          SINGLE_EVALUATOR: ${{ inputs.single_evaluator }}
          SUBMIT_DEMO: ${{ inputs.submit_demo }}
          DEMO_FRESH: ${{ inputs.demo_fresh }}
          PRISMA_TX_TIMEOUT_MS: "120000"
