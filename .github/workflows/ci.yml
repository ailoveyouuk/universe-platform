name: CI

# Runs on every PR and push to main: install, generate the Prisma client,
# typecheck, and build every app/package. This is the first real
# verification this scaffold gets — it was built in a sandbox with no npm
# registry access, so this workflow is where "does it actually compile"
# gets answered for the first time.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
