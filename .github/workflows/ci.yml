name: CI

# Runs on every PR and push to main: install, generate the Prisma client,
# typecheck, and build every app/package. This is the first real
# verification this scaffold gets — it was built in a sandbox with no npm
# registry access, so this workflow is where "does it actually compile"
# gets answered for the first time.
#
# NOTE: no package-lock.json is committed yet (it can only be generated by
# running `npm install` somewhere with real registry access, which the
# sandbox that built this scaffold didn't have). Until one exists, this
# step deliberately doesn't use setup-node's `cache: npm` option — that
# option requires a lockfile to be present just to resolve a cache key,
# even before install runs. Once package-lock.json is committed, re-add
# `cache: npm` here for faster runs and consider switching `npm install`
# to `npm ci` for reproducible installs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    # Real SQL Server, not a substitute — Row-Level Security
    # (infra/sql/row-level-security.sql) is SQL Server-specific syntax, so
    # tenant-isolation tests only mean something run against the real
    # engine family Azure SQL Database itself uses.
    services:
      mssql:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "UniverseTest!2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'UniverseTest!2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "sqlserver://localhost:1433;database=universe_test;user=sa;password=UniverseTest!2026;encrypt=true;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create test database
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P 'UniverseTest!2026' \
            -Q "IF DB_ID('universe_test') IS NULL CREATE DATABASE universe_test"

      - name: Push schema (prisma db push)
        run: npm run test:db:reset --workspace=@universe/db

      - name: Apply Row-Level Security (sqlcmd, not Prisma)
        # SQL Server requires CREATE FUNCTION / CREATE SECURITY POLICY to be
        # the only statement in their batch. Prisma's $executeRawUnsafe
        # can't satisfy that for SQL Server (confirmed here, run #4,
        # "Incorrect syntax near the keyword 'FUNCTION'") — see
        # packages/db/scripts/apply-rls.ts for the full explanation. sqlcmd
        # is already inside this image (mcr.microsoft.com/azure-sql-edge),
        # so this needs no extra install on the runner.
        run: |
          docker exec -i ${{ job.services.mssql.id }} /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P 'UniverseTest!2026' -d universe_test -b \
            < infra/sql/row-level-security.sql

      - name: Run @universe/db tests (RLS / tenant isolation)
        run: npm run test --workspace=@universe/db

      - name: Run @universe/api tests (invite/link flow)
        run: npm run test --workspace=@universe/api
