name: Seed demo framework

# Creates a simulated, awarded framework agreement SIM-FWK-001 with two active agreements (2026-10-22). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      tender_ref:
        description: Simulated tender reference
        default: SIM-FWK-001
        type: string
      product_offset:
        description: Product offset
        default: "0"
        type: string
      tender_title:
        description: Tender title
        default: Framework for essential medicines and consumables (simulated)
        type: string
      dry_run:
        description: "Dry run (writes nothing). Untick to apply."
        default: true
        type: boolean

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run build --workspace=@universe/auth --workspace=@universe/types
      - name: Seed framework (or dry run)
        run: npm run seed:demo-framework --workspace=@universe/db
        env:
          DATABASE_URL: ${{ secrets.DEMO_LOAD_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          TENDER_REF: ${{ inputs.tender_ref }}
          PRODUCT_OFFSET: ${{ inputs.product_offset }}
          TENDER_TITLE: ${{ inputs.tender_title }}
          PRISMA_TX_TIMEOUT_MS: "120000"
